<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v52セーブの書き出し</title><style>body{font:16px/1.8 system-ui,sans-serif;margin:24px;max-width:600px;color:#3c5544}button{font:inherit;padding:14px;background:#52785f;color:white;border:0;border-radius:12px;min-height:44px}</style><h1>v52セーブの書き出し</h1><p>v52を遊んだ<strong>同じURLのホスト・ブラウザ・端末</strong>で、この補助ページを開いてください。セーブを読み取ってJSONに保存します。元データの変更・削除はしません。</p><button id="export">v52セーブを書き出す</button><p id="result" role="status"></p><script>document.getElementById('export').onclick=()=>{try{const text=localStorage.getItem('gochisouCompany.currentGame.v1');if(!text)throw Error('この保存領域にはv52のセーブがありません。v52を遊んだ元のブラウザ・ホストで開いてください。');const parsed=JSON.parse(text);if(!parsed.inventory||!parsed.research)throw Error('想定したv52形式ではありません。元データは変更していません。');const url=URL.createObjectURL(new Blob([JSON.stringify(parsed,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='gochisou-v52-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('result').textContent='書き出しました。v53の「その他→設定→セーブを読み込む」で選んでください。'}catch(e){document.getElementById('result').textContent=e.message}};</script></html>
