function wholesalePage(){return '<div class="notice">営業終了時に自動販売。注文より低い単価（基準価格の42%）、1日全体で'+(8+s.research.sales*2)+'個まで。予約・保護在庫は使いません。</div>'+Object.keys(D.items).filter(id=>E.unlocked(s,id)).map(id=>'<div class="research-row">'+food(id)+'<div class="grow"><h3>'+D.items[id].name+'</h3><p>卸単価 '+yen(D.items[id].price*.42)+' / 在庫 '+E.qty(s,id)+'</p></div>'+btn((s.wholesale[id]||0)?'上限 '+s.wholesale[id]+'個':'OFF','wholesaleSheet',{id},'btn secondary compact')+'</div>').join('')}
function regionsPage(){return '<p class="intro">地域は得意な用途が違います。最初の町も安定した日常食の市場として残ります。</p>'+Object.entries(D.regions).map(([id,d])=>'<div class="card region-card"><div class="row spread"><h3>'+d.name+'</h3><span class="tag">'+(s.region===id?'活動中':s.regions.includes(id)?'進出済み':'未進出')+'</span></div><p class="small muted mt">'+d.desc+'</p>'+tags(d.tags)+'<div class="row spread mt"><span class="small">地域の実績 '+Math.min(8,s.regionStats[id]||0)+' / 8</span>'+btn(s.regions.includes(id)?'市場を選ぶ':yen(d.cost)+'で進出','regionSheet',{id},'btn compact',s.region===id)+'</div>'+(!s.regions.includes(id)?'<p class="edit-hint">会社Lv'+d.lv+' / 評判'+d.rep+' / 大会優勝は不要</p>':'')+'</div>').join('')}
function talentStats(t){return '<div class="talent-stats">'+Object.values(D.roles).map(r=>{const value=t.stats[r.stat]+(t.level-1)*2;return '<div><span>'+r.name+'</span><div class="meter"><i style="width:'+Math.min(100,value/30*100)+'%"></i></div><b>'+value+'</b></div>'}).join('')+'</div><p class="edit-hint">各能力は配置先で働きます。担当ごとの合計効果は45で上限。特技の同種効果は重複しません。</p>'}
function rarityBadge(t){return '<span class="rarity-badge rarity-'+(t.rarityIndex??D.staffRarities.indexOf(t.rarity))+'">'+esc(t.rarity)+'</span>'}
function applicantCard(t){return '<article class="card applicant-card"><div class="row">'+Art.avatar(t)+'<div class="grow">'+rarityBadge(t)+'<h3>'+esc(t.name)+'</h3><p class="small muted">'+D.roles[t.assigned].name+' / '+esc(t.trait)+'</p></div></div>'+talentStats(t)+'<p class="small talent-quote">「'+esc(t.line)+'」</p>'+btn('能力・採用後の変化を見る','talentSheet',{id:t.id},'btn secondary full mt')+'</article>'}
function recruitmentPage(){const r=s.recruitment,focus=recruitFocus;return '<div class="card recruit-intro"><span class="tiny-label">次の仲間と、次のごちそう。</span><h3>求人募集で、新しい出会いを。</h3><p class="small mt">募集したときだけ応募者が現れます。名前・能力・特技はランダム。候補は次の募集まで残り、日付だけでは入れ替わりません。</p><p class="edit-hint">募集費に採用費用を含みます。採用時の追加料金0円 / 1人につき日次費用＋10円。1営業日1回まで募集できます。</p><div class="field-row"><label for="recruit-focus">探す職種</label><select id="recruit-focus"><option value="any">おまかせ・全職種</option>'+Object.entries(D.roles).map(([id,d])=>'<option value="'+id+'" '+(focus===id?'selected':'')+'>'+d.name+'に絞る</option>').join('')+'</select></div></div><div class="campaign-grid mt">'+Object.entries(D.recruitment).map(([id,d])=>{const p=E.recruitPreview(s,id,focus);return '<div class="card campaign-card"><span class="tiny-label">'+d.count+'名の応募</span><h3>'+d.name+'</h3><strong class="campaign-price">'+yen(d.cost)+'</strong><p class="small muted">'+d.desc+'</p><details class="mt"><summary>レアリティの確率</summary><p class="small">通常の応募枠：'+d.odds.map((v,i)=>D.staffRarities[i]+' '+v+'%').join(' / ')+'</p>'+(d.guarantee?'<p class="edit-hint">1人目は'+D.staffRarities[d.guarantee]+'以上に限定：'+E.recruitmentOdds(id).map((v,i)=>v?D.staffRarities[i]+' '+(v*100).toFixed(1)+'%':'').filter(Boolean).join(' / ')+'。2人目以降は通常の確率です。</p>':'')+'</details>'+btn('この方法で募集','recruitSheet',{campaign:id},'btn secondary full mt',!p.ok)+(!p.ok?'<p class="edit-hint">'+esc(p.reason)+'</p>':'')+'</div>'}).join('')+'</div>'+head('届いている応募','', '<span class="tag">在籍 '+s.staff.length+' / '+E.staffLimit(s)+'人</span>')+(r.candidates.length?'<div class="applicants" id="applications">'+r.candidates.map(applicantCard).join('')+'</div>':'<div class="empty">'+(r.round?'今回の候補者は全員採用済みです。':'まだ応募者はいません。上の方法から求人を出してみましょう。')+'</div>')+(r.history.length?'<details class="card mt"><summary>これまでの募集</summary>'+r.history.slice(0,5).map(h=>'<p class="small mt">'+h.day+'日目 / '+D.recruitment[h.campaign].name+' / '+h.count+'人<br>'+h.rarities.map(esc).join('・')+'</p>').join('')+'</details>':'')}
function staffPage(){return '<p class="intro">採用前も、採用後も能力を確認できます。在籍している仲間は更新で失われません。</p>'+head('わたしたちのチーム','', '<span class="tag">'+s.staff.length+'人</span>')+s.staff.map(t=>'<article class="card staff-card"><div class="row">'+Art.avatar(t)+'<div class="grow"><h3>'+esc(t.name)+' <span class="tag">Lv'+t.level+'</span></h3>'+rarityBadge(t)+'<p class="small muted">今日の'+D.roles[t.assigned].name+' / '+esc(t.trait)+'</p></div></div><details class="mt"><summary>5つの能力と特技を見る</summary>'+talentStats(t)+'<p class="small">'+esc(D.staffSkills[t.special]?.desc||t.trait)+'</p></details><div class="row spread mt"><small>主能力 '+(t.stats[D.roles[t.assigned].stat]+(t.level-1)*2)+'</small><small>経験 '+t.exp+' / '+t.level*10+'</small></div><div class="meter mt"><i style="width:'+t.exp/(t.level*10)*100+'%"></i></div><p class="edit-hint">'+(t.usedDay===s.day?'今日の効果は使用済み・配置変更は明日から':'今日の効果は未使用・即時配置可能')+(t.nextAssignment?' / 明日は'+D.roles[t.nextAssignment].name:'')+'</p><div class="detail-actions">'+btn('能力の詳細','talentSheet',{id:t.id},'')+btn('配置','assignSheet',{id:t.id},'')+btn('研修・得意技','trainingSheet',{id:t.id},'')+btn('活躍の記録','staffHistory',{id:t.id},'')+'</div></article>').join('')+'<details class="card mt"><summary>連携「畑からパンへ」</summary><p class="small">「畑の名人」が農家として収穫した当日、「パンへの情熱」を持つ職人が工房にいるとパン類の品質分布が改善。名前に関係なく連携します。</p></details>'+jump('求人募集・応募者を見る','grow/recruit','btn full mt')}
function cashBanner(){const f=E.cashStatus(s);if(!f.low||s.ended)return '';return '<div class="card cash-banner mt"><div class="row spread"><div><span class="tiny-label">会社を立て直そう</span><h3>資金が少なくても、できる仕事があります</h3></div>'+icon('coin')+'</div><p class="small mt">材料なしの受託'+(f.remaining?'で最大'+yen(f.workIncome):'は明日また利用できます')+'。'+(f.aid.ok?'今は1,000円の再建支援も受けられます。':'余剰在庫の買取も相談できます。')+'</p>'+jump('資金繰りの方法を見る','trade/finance','btn full mt')+'</div>'}
function financePage(){const f=E.cashStatus(s),cash=s.finance,work=Math.max(0,Math.min(f.remaining,Math.ceil(Math.max(220,cash.target-s.money)/D.finance.workPay))),sellable=s.lots.filter(l=>E.stockSalePreview(s,l.lotId,1).ok);return '<div class="card tint"><span class="tiny-label">小さく立て直して、また前へ。</span><h3>資金繰りの相談室</h3><div class="metric-grid mt"><div class="metric"><small>手元の資金</small><b>'+yen(s.money)+'</b></div><div class="metric"><small>今夜の日次費用</small><b>'+yen(f.expense)+'</b></div><div class="metric"><small>受託できる枠</small><b>'+f.remaining+'</b></div></div><p class="edit-hint">在庫を作り過ぎず、まずは次の注文1件を届ける資金を。支援・受託は会社経験を増やしません。</p></div>'+head('材料なしで、確実に収入')+'<div class="card"><h3>地域の梱包・仕込みのお手伝い</h3><p class="small muted mt">加工1枠で220円。資金0円・倉庫満杯でも利用できます。</p><div class="field-row"><label for="contract-n">まとめて使う加工枠</label><input id="contract-n" type="number" min="1" max="'+f.remaining+'" value="'+(work||1)+'"></div><div id="contract-preview" class="notice">'+(f.remaining?'加工'+work+'枠 / 受取 '+yen(work*220):'今日は加工枠を使い切っています。翌営業日に回復します。')+'</div>'+btn('この分のお手伝いをする','contractExecute',{},'btn full mt',!f.remaining)+'<label class="row mt"><input id="finance-auto" type="checkbox" '+(cash.autoWork?'checked':'')+'> 閉店時に不足分だけ任せる</label><div class="field-row"><label for="finance-target">残しておきたい資金</label><input id="finance-target" type="number" min="500" max="3000" step="100" value="'+cash.target+'"></div><p class="edit-hint">注文の仕事が終わった後、余った加工枠で日次費用も見込んで補います。試作用に残した枠は使いません。上限まで働いても目標に届かない日はあります。</p>'+btn('お手伝いの設定を保存','financeSave',{},'btn secondary full mt')+'</div>'+head('今すぐの再建支援')+'<div class="card support-card"><h3>協同組合から1,000円の支援</h3><p class="small mt">資金500円以下で利用可能。返済不要。受けた日を含む3営業日は日次費用0円になり、スタッフも設備も維持できます。</p><p class="edit-hint">7営業日に1回まで。支援金は営業利益・会社経験には加算しません。'+(cash.reliefUntil>=s.day?'今は'+cash.reliefUntil+'日目まで費用免除中です。':'')+'</p>'+btn('支援内容を確認','aidSheet',{},'btn secondary full mt',!f.aid.ok)+(!f.aid.ok?'<p class="edit-hint">'+esc(f.aid.reason)+'</p>':'')+'</div>'+head('余剰在庫を現金に戻す')+'<div class="card"><h3>協同組合の在庫買取</h3><p class="small muted mt">今日あと'+f.saleRemaining+'個。通常の注文より安く、原価を下回る買取です。予約・保護品は対象外です。</p>'+(sellable.length?'<div class="field-row"><label for="sale-lot">買い取ってもらうロット</label><select id="sale-lot">'+sellable.map(l=>'<option value="'+esc(l.lotId)+'">'+esc(E.item(s,l.itemId).name)+' '+D.ranks[l.qualityRank]+' / '+l.quantity+'個 / '+l.expiresAfterDay+'日目まで</option>').join('')+'</select></div><div class="field-row"><label for="sale-n">個数</label><input id="sale-n" type="number" min="1" max="'+Math.min(sellable[0].quantity,f.saleRemaining)+'" value="1"></div><div id="sale-preview" class="notice">1個 / 受取 '+yen(E.stockSalePreview(s,sellable[0].lotId,1).income)+'</div>'+btn('この数量を買い取ってもらう','saleExecute',{},'btn secondary full mt'):'<p class="small mt">買い取れる余剰在庫はありません。</p>')+'</div>'+jump('受けられる注文を見る','trade/orders','btn outline full mt')}
function updateFinancePreview(){if($('contract-n')){const n=Number($('contract-n').value),ok=Number.isSafeInteger(n)&&n>0&&n<=E.craftLimit(s)-s.used.craft;$('contract-preview').textContent=ok?'加工'+n+'枠 / 受取 '+yen(n*D.finance.workPay):'残りの加工枠以内の整数を入力してください';const b=document.querySelector('[data-a="contractExecute"]');if(b)b.disabled=!ok}if($('sale-lot')){const lot=s.lots.find(l=>l.lotId===$('sale-lot').value);$('sale-n').max=Math.min(lot?.quantity||0,E.cashStatus(s).saleRemaining);const p=E.stockSalePreview(s,$('sale-lot').value,Number($('sale-n').value));$('sale-preview').textContent=p.ok?p.n+'個 / 受取 '+yen(p.income)+' / 元の原価 '+yen(p.cost):p.reason;const b=document.querySelector('[data-a="saleExecute"]');if(b)b.disabled=!p.ok}}
function talentSheet(id){const candidate=s.recruitment.candidates.find(t=>t.id===id),t=candidate||s.staff.find(t=>t.id===id);if(!t)return;const p=E.staffImpact(s,t);openSheet(t.name+'のプロフィール','<div class="talent-profile">'+Art.avatar(t)+'<div>'+rarityBadge(t)+'<h2>'+esc(t.name)+'</h2><p class="small">'+D.roles[t.assigned].name+' / Lv'+t.level+'</p></div></div>'+talentStats(t)+'<div class="card tint mt"><h3>'+esc(t.trait)+'</h3><p class="small mt">'+esc(D.staffSkills[t.special]?.desc||t.trait)+'</p>'+(t.spec?'<p class="small mt">専門研修：'+esc(D.staffSkills[t.spec]?.desc||t.spec)+'</p>':'')+'</div>'+(candidate?'<h3 class="mt">この職種で採用すると</h3><p class="small mt">'+p.role+'の合計能力 '+p.powerBefore+' → '+p.powerAfter+'<br>倉庫 '+p.capacityBefore+' → '+p.capacityAfter+'個 / 生産バッチ '+p.produceBefore+' → '+p.produceAfter+'個<br>加工バッチ '+p.craftBefore+' → '+p.craftAfter+'個 / 日次研究 '+p.researchBefore+' → '+p.researchAfter+'P</p><p class="edit-hint">既存の同種特技や能力上限に届いている場合、採用しても一部の効果は増えません。品質・契約の詳細は製造・受注のプレビューへ反映します。</p><div class="notice mt">採用時の費用0円 / 日次費用＋10円<br>採用後の通常日次費用 '+yen(30+s.staff.length*10)+'</div>'+btn('この仲間を採用する','do',{type:'hire',p:{id:t.id}},'btn full mt',s.staff.length>=E.staffLimit(s)):btn('担当を見直す','assignSheet',{id:t.id},'btn secondary full mt')));}

function researchPage(){return head('基本研究メニュー','','<span class="pill">'+icon('flask')+s.rp+' P</span>')+'<div class="card research-panel">'+Object.entries(D.research).map(([id,d])=>'<div class="research-row">'+icon(id==='quality'?'star':id==='recipe'?'book':'flask')+'<div class="grow"><h3>'+d.name+' <span class="tag">Lv'+s.research[id]+'</span></h3><p>'+d.desc+'</p></div>'+btn(s.research[id]>=6?'MAX':d.base*(s.research[id]+1)+' P','researchSheet',{id},'btn secondary compact',s.research[id]>=6||s.rp<d.base*(s.research[id]+1))+'</div>').join('')+'</div>'+head('品質改善研究所')+'<div class="card"><h3>納品前の、最後のひと手間。</h3><p class="small muted mt">在庫の加工品を1段階改善。1バッチ1加工枠、1個50〜150P。各ロット1回まで。素材上限と期限は維持します。</p>'+jump('改善する在庫を選ぶ','make/inventory','btn secondary full mt')+'</div>'+head('応用研究')+'<div class="card"><h3>製法標準化</h3><p class="small muted">商品ごとにC→B→A保証を獲得。素材上限以内で確実に適用。分布も安定します。</p><div class="field-row"><label for="standard-item">対象商品</label><select id="standard-item">'+Object.entries({...D.items,...Object.fromEntries(s.recipes.filter(r=>r.formal).map(r=>[r.id,E.item(s,r.id)]))}).filter(([id,d])=>d.recipe&&E.unlocked(s,id)).map(([id,d])=>'<option value="'+esc(id)+'">'+esc(d.name)+' / '+(s.standardized[id]||0)+'/3</option>').join('')+'</select></div>'+btn('標準化の条件を見る','standardSheet',{},'btn secondary full')+'</div><div class="card"><h3>市場分析</h3><p class="small muted">候補だけを更新。受注済みの単価・期限は変更しません。</p>'+btn('研究P60で分析する','confirm',{type:'market',p:{},title:'市場分析',text:'1日1回まで。注文候補のみ更新します。'},'btn secondary full mt',s.rp<60||s.used.analysis>=1)+'</div>'}
function facilitiesPage(){return '<p class="intro">強化しても今日の使用数は戻りません。増えた枠だけ新たに使えます。</p>'+Object.entries(D.facilities).map(([id,d])=>'<div class="card"><div class="row spread"><div class="row">'+icon(id==='farm'?'leaf':id==='warehouse'?'box':id==='lab'?'flask':'make')+'<h3>'+d.name+'</h3></div><span class="tag">Lv'+s.facilities[id]+'</span></div><p class="small muted mt">'+d.desc+'</p>'+btn(s.facilities[id]>=6?'最大まで成長しました':yen(Math.round(d.base*Math.pow(1.65,s.facilities[id]-1)))+'で増築','facilitySheet',{id},'btn secondary full mt',s.facilities[id]>=6)+'</div>').join('')}
function autoPage(){return workCard()+'<div class="notice">日次処理の順番：定時畑 → 小麦 → 野菜 → 小麦粉 → パン → サラダ → 高級パン。自動設備は手動枠を消費せず、1設備1日1バッチです。</div>'+Object.entries(D.auto).map(([id,d])=>{const a=s.auto[id];return '<div class="card mt"><div class="row">'+food(d.item)+'<div class="grow"><h3>'+d.name+'</h3><p class="small muted">'+(a?'Lv'+a.level+' / 最大'+(a.level+1)+'個':'建設条件：会社Lv'+d.lv+'・レシピ解放')+'</p></div><span class="tag '+(a?.enabled?'green':'')+'">'+(a?a.enabled?'稼働設定':'停止中':'未建設')+'</span></div>'+(a?'<p class="small mt">目標在庫 '+a.target+'個 / 現在 '+E.qty(s,d.item)+'個</p><p class="reason">'+esc(a.status)+'</p><div class="row mt">'+btn('稼働条件','autoSheet',{id},'btn secondary grow')+btn('増強 '+yen(d.cost*a.level),'confirm',{type:'autoBuild',p:{id},title:d.name+'を増強',text:'設備Lv＋1、日次バッチ＋1。費用 '+yen(d.cost*a.level)},'btn outline grow',a.level>=4)+'</div>':btn(yen(d.cost)+'で建設','confirm',{type:'autoBuild',p:{id},title:d.name+'を建設',text:'1日の目標在庫・最低品質・予算を設定できます。材料と倉庫の共通ルールを守ります。'},'btn secondary full mt',E.level(s)<d.lv||!E.unlocked(s,d.item)))+'</div>'}).join('')}

function signed(n){return (n>0?'+':'')+n}
function affinityHTML(a){if(!a)return '';return '<div class="affinity-summary"><div class="row spread"><h3>この配合の相性</h3><span class="tag '+(a.total>0?'green':a.total<0?'red':'')+'">合計 '+signed(a.total)+'</span></div><p class="small mt">品質の抽選値に <strong>'+signed(a.bonus)+'</strong>。'+(a.weak?'相性の合計が−1〜＋1なので、さらに−8〜＋8の偶然補正が入ります。':'相性がはっきりしているため、追加の偶然補正は入りません。')+'</p><details class="mt"><summary>食材ペアの内訳（7段階）</summary>'+(a.details.length?a.details.map(p=>'<div class="affinity-pair"><div class="row spread"><span>'+esc(D.items[p.a]?.name||p.a)+' × '+esc(D.items[p.b]?.name||p.b)+'</span><b>'+signed(p.tier)+'</b></div><p class="edit-hint">'+esc(p.label)+'：'+esc(p.reason)+'</p></div>').join(''):'<p class="small muted">同系統だけの配合は中立です。</p>')+'<p class="edit-hint">相性は−3〜＋3。合計×4を補正し、最大±24。同じ系統の食材を増量・高級品に変更してもペア加点は重複しません。味を一体にしたときの本作内の評価です。</p></details><p class="edit-hint">正の補正ほど高品質寄り。素材の品質上限・獲得済み保証は守ります。</p></div>'}
function qualityOdds(q){return '<p class="prob-legend">相性・偶然補正を含む確率：'+q.probabilities.map((p,i)=>p>.00001?D.ranks[i]+' '+(p*100).toFixed(1)+'%':'').filter(Boolean).join(' / ')+'</p>'}
function workSummary(r){return '<div class="preview-stats"><div><small>追加支出</small><b>'+yen(r.spent)+'</b></div><div><small>生産</small><b>'+r.produce+'枠</b></div><div><small>加工</small><b>'+r.craft+'枠</b></div></div>'+(r.delivered!==undefined?'<p class="small">納品 '+r.delivered+'件</p>':'')+(r.steps?.length?'<details class="mt"><summary>チームが行う仕事 '+r.steps.length+'工程</summary>'+r.steps.map(x=>'<div class="row spread small"><span>'+esc(E.item(s,x.id).name)+' ×'+x.n+'</span><span>'+({produce:'収穫',craft:'加工',buy:'仕入れ'}[x.type])+' / '+yen(x.cost)+'</span></div>').join('')+'</details>':'')+(r.stops?.length?'<div class="notice warn mt">'+r.stops.map(x=>esc(E.item(s,x.itemId).name)+'：'+esc(x.reason)).join('<br>')+'</div>':'')}
function remainingText(a){return '生産 あと'+a.remaining.produce+'枠 / 加工 あと'+a.remaining.craft+'枠'}
function todayPanel(){const a=advice(),todo=a.active.filter(o=>o.ok&&!o.ready),stopped=a.active.filter(o=>!o.ok&&!o.scheduled);return '<section class="card today-board mt" aria-label="今日できること"><div class="row spread"><h3>今日できること</h3><span class="tag">'+remainingText(a)+'</span></div><p class="today-title">'+esc(a.title)+'</p><div class="today-rows">'+(a.ready.count?'<div class="today-row"><div><strong>手元の商品で '+a.ready.count+'件納品</strong><small>追加の製造費なし / 報酬 '+yen(a.ready.reward)+'</small></div>'+btn('まとめて届ける','do',{type:'deliverReady',p:{}},'btn secondary')+'</div>':'')+todo.slice(0,2).map(o=>'<div class="today-row"><div><strong>'+esc(E.item(s,o.itemId).name)+' ×'+o.quantity+'</strong><small>材料から準備 / 追加 '+yen(o.spent)+'<br>生産'+o.produce+'・加工'+o.craft+'枠'+(o.scheduled?' / 閉店時にもお届け予定':'')+'</small></div>'+btn('準備して届ける','do',{type:'prepareOrder',p:{id:o.id,deliver:true}},'btn secondary')+'</div>').join('')+(a.newOffers.length?'<div class="today-row"><div><strong>今日対応できる注文候補 '+a.newOffers.length+'件</strong><small>引き受けるかは自由に選べます</small></div>'+jump('注文を選ぶ','trade/orders','btn outline')+'</div>':'')+(!a.ready.count&&!todo.length&&!a.newOffers.length?'<p class="small muted">今すぐ確実に進められる注文はありません。'+(a.close.scheduledIds.length?'閉店時の準備はスタッフが進めます。':a.close.risks.length?'閉店前の確認を見てから進めましょう。':'余力は、次の目標を考える時間にもできます。')+'</p>':'')+'</div>'+(stopped.length?'<details><summary>準備が必要な注文 '+stopped.length+'件</summary>'+stopped.slice(0,6).map(o=>{const h=E.orderGuidance(s,s.orders.find(x=>x.id===o.id)).next;return '<div class="today-row"><div><strong>'+esc(E.item(s,o.itemId).name)+'</strong><small>'+esc(h.title)+'</small></div>'+btn('準備を見る','planSheet',{id:o.id},'btn outline')+'</div>'}).join('')+'</details>':'')+(a.growth.length?'<details class="optional-growth"><summary>任意の成長：'+a.growth.slice(0,3).map(g=>g.label+' '+g.count).join(' / ')+'</summary><p class="edit-hint">それぞれ単独なら実行可能です。費用や枠は共通なので、選ぶと残りは変わります。</p>'+a.growth.map(g=>'<div class="today-row"><div><strong>'+g.label+'</strong><small>'+g.count+'種類を選べます</small></div>'+jump('選ぶ',g.to,'btn outline')+'</div>').join('')+'</details>':'')+'<p class="edit-hint">余力は使い切らなくて大丈夫。必要な注文や、育てたいものがあるときに使いましょう。</p></section>'}
function closingSummary(){const a=advice(),c=a.close,r=c.report;if(!c.ok)return '<div class="notice warn">閉店処理を確認できません：'+esc(c.reason)+'</div>';if(!r)return '';const additional=r.materialSpend+r.direct-s.ledger.materialSpend-s.ledger.direct;return '<div class="card tint mt closing-summary"><div class="row spread"><h3>閉店すると進むこと</h3><span class="tag green">'+E.presetName(s)+'</span></div>'+(c.scheduledIds.length?'<p class="small mt">スタッフが '+c.scheduledIds.length+'件お届けします。</p><div class="chips mt">'+s.orders.filter(o=>c.scheduledIds.includes(o.id)).map(o=>'<span class="tag">'+esc(E.item(s,o.itemId).name)+' ×'+o.quantity+'</span>').join('')+'</div>':'<p class="small mt">注文の自動納品予定はありません。</p>')+'<p class="edit-hint">追加の生産・加工費 '+yen(additional)+' / 研究 ＋'+r.research+'P</p>'+(r.financeWork?.enabled?'<p class="small">資金のお手伝い：'+r.financeWork.frames+'枠 / ＋'+yen(r.financeWork.income)+'<br>'+esc(r.financeWork.reason)+'</p>':'')+''+(r.delegation?.stops?.length?'<details><summary>スタッフだけでは進まない仕事 '+r.delegation.stops.length+'件</summary>'+r.delegation.stops.map(x=>{const job=s.orders.find(o=>o.id===x.id),next=job&&/品質|保証|素材|レシピ|解放/.test(x.reason)?E.orderGuidance(s,job).next:null,h=E.stopAdvice(x.reason);return '<div class="today-row"><div><strong>'+esc(E.item(s,x.itemId).name)+'</strong><small>'+esc(next?.title||h.title)+'</small></div>'+(next?btn(esc(next.label),next.action,next.p,'btn outline'):jump(h.link,h.to,'btn outline'))+'</div>'}).join('')+'</details>':'')+'<div class="row spread mt"><small class="muted">任せ方はいつでも変えられます</small>'+jump('任せ方を選ぶ','make/plan')+'</div></div>'}
function riskPanel(){const risks=advice().close.risks;return risks.length?'<div class="closing-risks mt"><h3>閉店前の確認 '+risks.length+'件</h3>'+risks.map(r=>'<div class="today-row"><div><strong>'+esc(r.title)+'</strong><small>'+esc(r.text)+'</small></div>'+(r.action?btn('相談する',r.action,{},'btn outline'):jump('確認する',r.to,'btn outline'))+'</div>').join('')+'</div>':'<p class="small muted mt">この閉店処理での納期超過・廃棄の見込みはありません。</p>'}
function workCard(){const p=s.workPlan;return '<div class="card tint work-card mt"><h3>つくる・届けるをスタッフへ</h3><p class="small mt">現在：'+E.presetName(s)+'</p><p class="edit-hint">注文を選んだら、必要な収穫から納品まで任せられます。</p>'+jump(p.enabled?'任せ方と予定を見る':'任せ方を選ぶ','make/plan','btn secondary full mt')+'</div>'}
function workPage(){const p=s.workPlan,r=E.workPreview(s),foods=[...Object.keys(D.items).filter(id=>D.items[id].recipe&&E.unlocked(s,id)),...s.recipes.filter(x=>x.formal).map(x=>x.id)],current=E.presetName(s);return '<div class="card tint"><span class="tiny-label">注文を選ぶのは、あなた。</span><h3>つくる・届けるは、スタッフに。</h3><p class="small mt">受注した注文について、不足する材料の収穫・仕入れ・加工・納品をまとめて行います。人を増やしたり、設備を買ったりしなくても使えます。</p><div class="work-flow"><span>'+food('wheat')+'必要な素材</span><span>'+food('flour')+'中間加工</span><span>'+food('bread')+'商品を製造</span><span>'+icon('trade')+'お届け</span></div><p class="edit-hint">日付が勝手に進むことはありません。「今日を締める」で1日分を実行します。新しい注文は自分で選びます。</p></div>'+head('まずは、任せ方をひとつ選ぶ')+Object.entries(E.workPresets).map(([mode,d])=>'<div class="card preset-card '+(current===d.name?'selected':'')+'"><div class="row spread"><h3>'+d.name+'</h3>'+(current===d.name?'<span class="tag green">選択中</span>':'')+'</div><p class="small muted mt">'+d.desc+'</p>'+(mode!=='manual'?'<p class="edit-hint">1日1,200円まで・材料費と加工費だけ。作業枠は手作業と共通。定番在庫の追加仕込みはOFF。</p>':'')+btn(current===d.name?'この任せ方で進行中':'この任せ方にする','do',{type:'workPreset',p:{mode}},'btn secondary full mt',current===d.name)+'</div>').join('')+head('いま任せると、どうなる？')+'<div class="card">'+(p.enabled?'<p class="small">'+(r.delivered?r.delivered+'件お届けできます。':r.steps.length?'注文の仕込みを進められます。':s.orders.length?'いまは進められる仕事がありません。':'注文を引き受けると、ここに仕事が表示されます。')+'</p>'+workSummary(r)+(r.steps.length||r.delivered?btn('この仕事を今進める','do',{type:'runWorkPlan',p:{}},'btn full mt'):jump(s.orders.length?'注文の準備を確認':'注文を選ぶ','trade/orders','btn secondary full mt')):'<p class="small muted">上で任せ方を選ぶと、具体的な仕事と費用が表示されます。</p>')+'</div><details class="card work-details"><summary>細かく調整する（通常は変更不要）</summary><label class="row mt"><input id="work-enabled" type="checkbox" '+(p.enabled?'checked':'')+'> 閉店時に注文を進める</label><label class="row mt"><input id="work-orders" type="checkbox" '+(p.orders?'checked':'')+'> 受注済みを納期順に準備する</label><label class="row mt"><input id="work-deliver" type="checkbox" '+(p.deliver?'checked':'')+'> 準備できた注文を納品する</label><div class="field-row"><label for="work-budget">1日の準備予算</label><input id="work-budget" type="number" min="0" max="100000" value="'+p.budget+'"></div><div class="field-row"><label for="work-item">追加で仕込む定番商品</label><select id="work-item">'+foods.map(id=>'<option value="'+id+'" '+(p.targetItem===id?'selected':'')+'>'+esc(E.item(s,id).name)+'</option>').join('')+'</select></div><div class="field-row"><label for="work-target">定番の在庫目標（0で停止）</label><input id="work-target" type="number" min="0" max="30" value="'+p.target+'"></div><div class="field-row"><label for="work-keep">自分用に残す加工枠</label><input id="work-keep" type="number" min="0" max="100" value="'+p.keepCraft+'"></div><div class="field-row"><label for="work-policy">製造方針</label><select id="work-policy">'+['standard','mass','careful'].map(k=>'<option value="'+k+'" '+(p.policy===k?'selected':'')+'>'+D.policies[k].name+'</option>').join('')+'</select></div><p class="edit-hint">「今進める」と閉店時で予算を共有。定時の畑や購入済みの自動設備は別設定・別予算です。保護中・他の注文の予約品は使いません。</p>'+btn('調整した内容を保存','workSave',{},'btn full mt')+'</details><details class="card"><summary>進まないときは？</summary><p class="small">必要な品質を保証できない注文、予算・作業枠・倉庫が不足する仕事は止まります。無駄な作り直しを避けるためです。停止理由から必要な画面へ移動できます。</p><p class="edit-hint">任せてもスタッフと素材は手作業と同じ条件で育ちます。</p></details>'+(s.lastDelegation?.enabled?'<details class="card"><summary>前回の仕事ノート</summary>'+workSummary(s.lastDelegation)+'</details>':'')+jump('生産能力を増やす自動設備へ','grow/auto','btn outline full mt')}
function bundleSection(o){if(!s.orders.some(x=>x.id===o.id))return '<p class="edit-hint">受注後はここから材料の用意と製造をまとめて行えます。</p>';const p=E.preparePreview(s,o.id);return '<div class="card tint mt"><h3>材料から、まとめて準備</h3>'+(p.ok?workSummary(p)+'<p class="edit-hint">保護・他の注文の予約を守り、期限の近い材料から使います。品質条件を保証できる範囲だけ実行。現在の在庫を使うため、費用は追加支出です。</p><label class="row mt"><input id="bundle-deliver" type="checkbox" checked> 仕上がったらこの注文へ納品する</label>'+btn('まとめて進める','bundleExecute',{id:o.id},'btn full mt'):'<div class="notice warn mt">'+esc(p.reason)+'</div><p class="edit-hint">上の「次にすること」から条件を整えられます。品質の抽選が必要な製造は、この一括操作では実行しません。</p>')+'</div>'}

 newCompany:()=>openSheet('もうひとつの会社を始める','<p class="small muted">今の会社を残して、別のセーブで始めます。同じシードとルール版なら同じ初期条件になります。</p><div class="welcome-fields mt"><label>会社名<input id="new-name" maxlength="24" value="こもれび食品"></label><label>初期シード<input id="new-seed" maxlength="60" value="'+esc(s?.seed||welcomeSeed)+'"></label><label>シナリオ<select id="new-scenario">'+Object.entries(D.scenarios).map(([id,d])=>'<option value="'+id+'">'+d.name+'</option>').join('')+'</select></label></div><div id="scenario-hint" class="notice mt">'+D.scenarios.standard.desc+'</div>'+btn('この条件で開業する','startNew',{},'btn full mt')),
 startNew:()=>{if(env&&Object.keys(env.runs).length>=30){toast('保存会社数の上限30件です。バックアップを書き出して保管してください。');return}const ns=E.newGame($('new-seed').value,$('new-scenario').value,$('new-name').value);if(env){env.runs[ns.runId]=ns;env.current=ns.runId}else env=S.envelope(ns);s=ns;save();Audio.unlock();closeSheet();route='home';sub='';render(false);window.scrollTo(0,0)},
 companyList:()=>openSheet('保存してある会社',Object.values(env.runs).map(r=>'<div class="card"><h3>'+esc(r.name)+'</h3><p class="small muted">'+r.day+'日目 / '+D.scenarios[r.scenario].name+' / '+yen(r.money)+'</p>'+btn(r.runId===env.current?'現在の会社':'この会社で続ける','switchCompany',{id:r.runId},'btn secondary full mt',r.runId===env.current)+'</div>').join('')),
 switchCompany:p=>{checkSaved();env.current=p.id;s=env.runs[p.id];save();closeSheet();route='home';sub='';render(false)},
 welcomeStart:()=>{handlers.newCompany()},temporaryStart:()=>{temporary=true;blocked='';if(!store)store=S.createStore({getItem:()=>null,setItem:()=>{}});handlers.newCompany()},
 legacyImport:()=>{try{const text=store.legacy();checkSaved();const incoming=S.parse(text);pendingImport=incoming;importReview(incoming)}catch(e){toast(e.message)}},
 importConfirm:()=>{try{if(!s&&blocked){if(!store){temporary=true;blocked='';store=S.createStore({getItem:()=>null,setItem:()=>{}})}else{env=store.recover(pendingImport);s=env.runs[env.current];blocked='';saved=true;pendingImport=null;closeSheet();render(false);toast('バックアップから復旧しました。壊れた元データも退避しています。');return}}checkSaved();env=store.merge(env,pendingImport);s=env.runs[env.current];pendingImport=null;save();closeSheet();route='home';sub='';render(false);toast(temporary?'一時プレイとして読み込みました。終了前に書き出してください。':saved?(s.legacy?'v52の会社を別セーブとして引き継ぎました':'バックアップを別セーブとして読み込みました'):'読み込み済みですが保存できません。バックアップを保管してください。')}catch(e){toast(e.message)}},
 itemInfo:p=>{const d=E.item(s,p.id);openSheet(d.name,'<div class="center">'+food(p.id)+'</div>'+tags(d.tags)+'<p class="small mt">'+(d.recipe?'材料：'+Object.entries(d.recipe).map(([id,n])=>esc(E.item(s,id).name)+'×'+n).join(' / '):d.farm?'畑で生産。生産経験で素材品質が確実に成長します。':'仕入れで入手。営業・仕入れ契約で条件を改善します。')+'</p><p class="small mt">最高記録 '+(s.catalog[p.id]!==undefined?D.ranks[s.catalog[p.id]]:'未発見')+' / 熟練 '+(s.mastery[p.id]||0)+' / 品質保証 '+D.ranks[s.guarantees[p.id]||0]+'</p><p class="edit-hint">基準価格 '+yen(d.price)+' / 標準原価 '+yen(E.standardCost(s,p.id))+'。基準価格と実際の契約報酬は異なります。</p>'+jump('製造へ',d.recipe?'make/craft':d.farm?'make/produce':'make/buy','btn secondary full mt'))},
 help:p=>{const sections=[['在庫と鮮度','在庫はロットごとに管理します。初期3営業日：入庫当日・翌日・翌々日に使え、翌々日の締めに残りを廃棄。追加入庫・部分消費・品質改善では期限は延びません。予約は注文用、保護は自動消費防止です。期限切れを防ぐ機能ではありません。容量は材料消費後の正味個数で判定します。'],['品質と素材','Eは素朴な仕上がりで、安全性の評価ではありません。素材潜在力の加重平均を切り捨て＋2が品質上限。E中心はC、D中心はB、C中心はA。中間品は元素材の潜在力を引き継ぎます。品質保証も素材上限まで。品質研究と職人は上限内の分布を改善します。画面表示と実際の抽選は同じ関数です。オリジナルの食材相性は7段階。ペア点を合計×4し最大±24で品質抽選値に加算。合計−1〜＋1はさらに−8〜＋8の偶然補正。いずれも素材上限と品質保証を守ります。'],['日付と能力枠','「翌日へ」でだけ日付が進みます。生産枠と加工枠は別。設備強化しても使用数は戻りません。効果を使ったスタッフの変更は翌日予約。無料のおまかせは通常の生産・加工枠を使います。設備を増やす自動施設は1日1バッチで手動枠と別です。閉じている間に在庫は腐らず、契約も失敗しません。'],['注文とお金','候補は義務ではありません。受注すると条件が固定され、期間3日なら当日を含む3日間。材料をそろえただけでは納品扱いになりません。納品ボタンまたは許可した自動納品が必要です。概算利益は標準材料費と直接費による目安。現金収支と販売利益は区別します。'],['育成と保証','畑の素材は倉庫に入った収穫2個につき経験1（作物ごとの日次上限あり）。小分け連打の優遇はなく、委任も同じ経験です。仕入れ品は契約投資で成長。常連への納品3・6・9回で関係が進み、その商品にC・B・A保証への道が開けます。製法標準化にも確定ルートがあります。会社Lvは累積経験で上がり、評判が下がっても下がりません。'],['保存と引き継ぎ','ブラウザのlocalStorageに会社と日次確定情報を一括保存し、直前の正常保存も保持。保存不能時は進行を停止して、再保存・書き出しを案内します。別タブの変更も検出します。v52は旧数量・品質をロットへ移行し、推定期限や猶予は記録。新規シナリオは元の会社を消しません。'],['注文の次の操作','注文カードは、足りない最初の工程を示します。ボタンから商品と数量を引き継ぎ、準備後は次の工程へ更新。材料が揃ったときだけ実際の品質確率を表示します。素材上限不足は素材育成、確率を抑えたいときは製法標準化。受注枠・当日上限・資金・研究Pが足りない理由もその場所で読めます。'],['食卓企画','6日目または会社Lv3から、ホームと顧客画面に招待状が届きます。任意・期限なし・同時1件。完成品2種類を各1個と、届け方を選び、用途60点・味の違い14点・届け方14点・品質12点で評価。事前の点数がそのまま結果になります。初回だけ研究P20〜40と各商品熟練＋3。再挑戦は最高献立を更新し、追加報酬なし。提出前の料理は通常の鮮度管理が続き、提出時に消費します。必要な料理は材料から一括準備できます。']];openSheet(sections[p.index][0],'<p class="small" style="line-height:2">'+sections[p.index][1]+'</p>')}
};
function checkSaved(){if(blocked&&!temporary)throw Error('現在の状態を保存・復元してから行ってください')}
let pendingImport=null;
function importReview(incoming){const ns=incoming.runs[incoming.current];openSheet('読み込むデータを確認','<p class="small">'+esc(ns.name)+' / '+ns.day+'日目 / '+yen(ns.money)+'<br>在庫 '+E.total(ns)+'個・受注 '+ns.orders.length+'件・スタッフ '+ns.staff.length+'人</p><p class="small muted mt">現在の会社は削除せず、別の会社として追加します。</p>'+(ns.legacy?'<div class="notice warn mt">v52からの移行です。期限は旧データからの推定。受注には最低2営業日の猶予を付けます。元データも保持します。</div>':'')+btn('確認して読み込む','importConfirm',{},'btn full mt'))}
function welcome(error=''){const demo=E.newGame('DISPLAY');$('header').innerHTML='';$('daybar').innerHTML='';$('nav').innerHTML='';$('save-warning').innerHTML='';let legacy=false;try{legacy=!!store?.legacy()}catch(e){}$('main').innerHTML='<div class="welcome">'+(P?.local?'<div class="notice local-notice">ファイルから開いています。保存が使えない場合は一時プレイとバックアップを利用できます。<a href="'+esc(P.playURL)+'">Safari・Chromeで開くブラウザ版</a></div>':'')+'<div class="welcome-logo">'+food('bread')+'<span class="tiny-label" style="display:block">あなたの工夫が、食卓に届く。</span><h1>ごちそう<br>カンパニー</h1><p class="sub">小さな食品会社のものがたり</p></div>'+Art.scene(demo)+'<p class="lead center">畑で育てて、工房でつくって。<br>お客さまの「また食べたい」を増やそう。<br>60日後、どんな会社になっているだろう。</p>'+(error?'<div class="notice warn">'+esc(error)+'</div><div class="stack mt">'+btn('バックアップから復元','restoreSheet',{},'btn full',!store)+btn('セーブファイルを読み込む','import',{},'btn secondary full')+btn('保存しない一時プレイ','temporaryStart',{},'btn outline full')+'</div>':'<div class="stack">'+btn('会社をはじめる '+icon('arrow'),'welcomeStart',{},'btn full')+btn('セーブを読み込む','import',{},'btn secondary full')+(legacy?btn('このブラウザのv52を引き継ぐ','legacyImport',{},'btn outline full'):'')+'</div>')+'<p class="splash-footer">v58 · 外部通信なし · リアル時間の待機なし<br>音は設定から。あなたのペースで、どうぞ。</p></div>';observeScene()}
let observer=null;function observeScene(){if(observer)observer.disconnect();const el=document.querySelector('.company-scene');if(el&&'IntersectionObserver'in window){observer=new IntersectionObserver(entries=>entries.forEach(e=>e.target.classList.toggle('scene-paused',!e.isIntersecting)),{threshold:.05});observer.observe(el)}if(route==='make'&&sub==='original')updateDraftPreview()}
document.addEventListener('click',ev=>{const scene=ev.target.closest('[data-jump]');if(scene&&s){go(scene.dataset.jump);return}const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const action=el.dataset.a;try{Audio.unlock();const p=JSON.parse(el.dataset.p||'{}');if(!handlers[action])throw Error('操作が見つかりません：'+action);const task=handlers[action](p,Number(el.dataset.seq)||undefined);if(task&&typeof task.catch==='function')task.catch(e=>{console.error(e);toast('操作を完了できませんでした：'+e.message)})}catch(e){console.error(e);toast('操作を完了できませんでした：'+e.message)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.dataset.jump&&s)go(ev.target.dataset.jump)});
document.addEventListener('input',ev=>{if(['contract-n','sale-n'].includes(ev.target.id))updateFinancePreview();if(['craft-n','craft-policy'].includes(ev.target.id)||ev.target.dataset.substitute)updateCraftPreview();if(['buy-n','buy-overflow'].includes(ev.target.id))updateBuyPreview();if(ev.target.id==='produce-n')updateProducePreview();if(ev.target.id==='improve-n')updateImprovePreview();if(ev.target.id==='draft-name'||ev.target.id==='draft-main'||ev.target.dataset.ingredient)updateDraftPreview();if(ev.target.id==='new-scenario')$('scenario-hint').textContent=D.scenarios[ev.target.value].desc});
document.addEventListener('change',ev=>{if(['dining-lot-0','dining-lot-1','dining-service'].includes(ev.target.id))updateDiningPreview();if(ev.target.id==='sale-lot')updateFinancePreview();if(ev.target.id==='recruit-focus')recruitFocus=ev.target.value;if(ev.target.id==='buy-overflow')updateBuyPreview();if(ev.target.id==='produce-overflow')updateProducePreview();if(['craft-policy'].includes(ev.target.id)||ev.target.dataset.substitute)updateCraftPreview();if(ev.target.id==='draft-main')updateDraftPreview();if(ev.target.id==='new-scenario')$('scenario-hint').textContent=D.scenarios[ev.target.value].desc});
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){const r=$('sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet()}});
$('import-file').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{if(f.size>12000000)throw Error('12MB以内のJSONファイルを選んでください');pendingImport=S.parse(P?await P.readText(f):await f.text());importReview(pendingImport)}catch(e){toast(e.message)}finally{ev.target.value=''}});
window.addEventListener('storage',ev=>{if(ev.key===(qaMode?'QA_ONLY.':'')+S.KEY&&s&&!temporary){blocked='別タブで会社データが更新されました。古い状態の上書きを防ぐため停止しています。';saved=false;render()}});
window.addEventListener('beforeunload',ev=>{if((blocked||temporary)&&s){ev.preventDefault();ev.returnValue=''}});
document.addEventListener('visibilitychange',()=>{document.querySelectorAll('.company-scene').forEach(el=>el.classList.toggle('scene-paused',document.hidden));if(!document.hidden)observeScene()});
window.addEventListener('error',ev=>{console.error('GC UI',ev.error);if($('toast'))toast('画面で問題が起きました。再読み込みか、設定からバックアップを確認してください。')});
window.gameActions=Object.fromEntries(Object.keys(E.actions).map(k=>[k,p=>apply(k,p||{})]));
window.GCApp={get state(){return s},get envelope(){return env},get route(){return route+'/'+sub},get handlers(){return Object.keys(handlers)},go,render,loadForTest(state){E.validate(state);env=S.envelope(state);s=state;store.resetExpectation();save();render()},dispatch:apply};
try{store=S.createStore(storageBackend());env=store.load();if(env){s=env.runs[env.current];Audio.setup(s.settings);render(false);if(s.ended)showEvaluation();else{const due=s.orders.length?Math.min(...s.orders.map(o=>o.dueDay))+'日目':'未受注';toast('おかえりなさい。次の納期：'+due+'。離れている間の損失はありません。')}}else welcome()}catch(e){if(e.code==='STORAGE_UNAVAILABLE')store=null;blocked=e.message;welcome(e.message)}
P?.ready();
})();

</script></body></html>
