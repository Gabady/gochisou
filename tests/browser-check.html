<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ごちそうカンパニー ブラウザ確認</title><style>body{font:14px/1.7 system-ui,sans-serif;background:#f6f4e9;color:#374e40;margin:20px}button{padding:12px 18px;background:#4f775f;color:white;border:0;border-radius:10px;cursor:pointer}iframe{display:block;width:390px;height:844px;border:1px solid #c7d3be;border-radius:14px;max-width:100%;background:#f8f4e9}#result{white-space:pre-wrap}li{margin:6px 0}.fail{color:#ad513a}.pass{color:#477846}.layout{display:flex;flex-wrap:wrap;gap:25px}.layout>div{flex:1;min-width:280px}</style><h1>v59 ブラウザ受入確認</h1><p>このページは検証用です。通常のセーブには触れず、<code>QA_ONLY.</code>から始まる別領域で実行します。HTTPSまたはローカルHTTPサーバーで開いてください。</p><p><button id="run">画面幅・操作・再開を確認する</button> <button id="advanced">後半の状態を表示</button></p><div class="layout"><div><div id="result">未実施。ボタンを押したブラウザで結果が記録されます。実機で文字拡大・ソフトキーボード・音も別途確認してください。</div></div><div><iframe id="game" src="../index.html?qa=1" title="検証用ゲーム"></iframe></div></div><script src="../data.js"></script><script src="../flavor.js"></script><script src="../engine.js"></script><script src="../actions.js"></script><script src="../planning.js"></script><script src="../recruitment.js"></script><script src="../finance.js"></script><script src="../advisor.js"></script><script src="../guidance.js"></script><script src="../dining.js"></script><script src="../progression.js"></script><script>
const frame=document.getElementById('game'),out=document.getElementById('result'),routes=['home','make/plan','make/craft','make/produce','make/buy','make/inventory','make/original','trade/orders','trade/finance','trade/customers','trade/wholesale','trade/regions','grow/staff','grow/recruit','grow/research','grow/facilities','grow/auto','grow/invest','more/book','more/contests','more/rivals','more/timeline','more/settings'];
const pause=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));let lines=[];function record(ok,text){lines.push((ok?'✓ ':'✗ ')+text);out.textContent=lines.join('\n')}
function data(){let s=GCEngine.newGame('BROWSER-QA');s.money=500000;s.rp=2000;s.day=6;s.companyXP=250;s.levelClaimed=11;s.research={production:2,processing:2,quality:3,storage:1,sales:2,recipe:5};s.staff.push(GCEngine.makeStaff('komugi'),GCEngine.makeStaff('aoi'));s.regions=['town','shopping','city'];s.reputation=80;return s}
document.getElementById('advanced').onclick=()=>{frame.contentWindow.GCApp.loadForTest(data());frame.contentWindow.GCApp.go('home')};
document.getElementById('run').onclick=async()=>{lines=[];try{const w=frame.contentWindow,app=w.GCApp;app.loadForTest(data());for(const width of [320,360,390,430]){frame.style.width=width+'px';await pause();for(const route of routes){app.go(route);await pause();const doc=w.document;const overflow=doc.documentElement.scrollWidth>w.innerWidth+1;const unbound=[...doc.querySelectorAll('[data-a]')].filter(el=>!app.handlers.includes(el.dataset.a));record(!overflow&&!unbound.length,width+'px '+route+' / はみ出し '+overflow+' / 未接続 '+unbound.length)}}frame.style.width='390px';app.loadForTest(GCEngine.newGame('FLOW'));let s=app.state;app.dispatch('craft',{id:'flour',n:3});app.dispatch('craft',{id:'bread',n:3});app.dispatch('accept',{id:app.state.candidates[0].id});app.dispatch('deliver',{id:app.state.orders[0].id});record(app.state.stats.delivered===1,'最初の製造・受注・納品');app.dispatch('nextDay',{day:1});record(app.state.day===2,'日次処理');const seq=app.state.transactionSeq;await new Promise(resolve=>{frame.onload=resolve;frame.contentWindow.location.reload()});record(frame.contentWindow.GCApp.state.day===2&&frame.contentWindow.GCApp.state.transactionSeq===seq,'再読込で日付と取引回数を維持');frame.contentWindow.GCApp.go('home');record(true,'自動確認終了。次は実タッチ、200%文字拡大、キーボード、消音、減速設定を手動確認');}catch(e){record(false,e.message)}};
</script></html>
